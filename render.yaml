services:
  - type: web
    name: nexalearn-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: MONGO_DB_NAME
        value: nexalearn
      - key: FRONTEND_URL
        fromService:
          type: web
          name: nexalearn-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: nexalearn-web
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build:render
    staticPublishPath: dist/ai-learning-platform/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: nexalearn-api
          envVarKey: RENDER_EXTERNAL_URL
