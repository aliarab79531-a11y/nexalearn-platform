<article class="course-card"><div class="course-thumb" [style.background]="course.color"><span class="material-symbols-outlined">{{course.icon}}</span><span class="level-tag">{{course.level}}</span></div><div class="course-content"><small>{{course.category}}</small><h3>{{course.title}}</h3><div class="course-stats"><span><span class="material-symbols-outlined">menu_book</span>{{course.lessons}} lessons</span><span><span class="material-symbols-outlined">schedule</span>{{course.duration}}</span></div>@if (course.progress) {<div class="progress-label"><span>Your progress</span><strong>{{course.progress}}%</strong></div><div class="progress"><span [style.width.%]="course.progress"></span></div>}<a class="course-link" [routerLink]="'/course/' + course.id">{{ continue ? 'Continue learning' : 'View course' }} <span class="material-symbols-outlined">arrow_forward</span></a></div></article>
