    @if (isPublic()) {
      <app-navbar />
    } @else {
      <button class="mobile-nav-toggle" type="button" [attr.aria-expanded]="sidebarOpen" aria-controls="workspace-sidebar" [attr.aria-label]="sidebarOpen ? 'Close navigation' : 'Open navigation'" (click)="sidebarOpen = !sidebarOpen" (window:keydown.escape)="closeSidebar()">
        <span class="material-symbols-outlined">{{ sidebarOpen ? 'close' : 'menu' }}</span>
      </button>
      @if (sidebarOpen) {
        <button class="sidebar-backdrop" type="button" aria-label="Close navigation" (click)="closeSidebar()"></button>
      }
      <app-sidebar id="workspace-sidebar" [class.mobile-open]="sidebarOpen" (click)="closeSidebar()" />
    }
    <main [class.public-main]="isPublic()" [class.app-main]="!isPublic()">
      <router-outlet />
    </main>
    <app-site-footer [class.workspace-footer]="!isPublic()" />
