<header class="site-header">
  <div class="navbar-shell">
    <a class="brand" routerLink="/" (click)="closeMobileMenu()" aria-label="NexaLearn AI home">
      <span class="brand-mark" aria-hidden="true">
        <span class="material-symbols-outlined">auto_awesome</span>
      </span>
      <span class="brand-copy">
        <strong>NexaLearn</strong>
        <span>AI LEARNING</span>
      </span>
    </a>

    <button
      class="mobile-menu"
      type="button"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-controls="public-navigation"
      [attr.aria-label]="mobileMenuOpen ? 'Close menu' : 'Open menu'"
      (click)="toggleMobileMenu()"
      (window:keydown.escape)="closeMobileMenu()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">
        {{ mobileMenuOpen ? 'close' : 'menu' }}
      </span>
    </button>

    <div class="navbar-panel" [class.menu-open]="mobileMenuOpen" id="public-navigation">
      <nav class="desktop-nav" aria-label="Main navigation">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Home</a>
        <a routerLink="/courses" routerLinkActive="active" (click)="closeMobileMenu()">Courses</a>
        <a routerLink="/learning-paths" routerLinkActive="active" (click)="closeMobileMenu()">Learning Paths</a>
        <a routerLink="/ai-tutor" routerLinkActive="active" (click)="closeMobileMenu()">AI Tutor</a>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About</a>
      </nav>

      <div class="nav-actions">
        <button class="language-button" type="button" (click)="toggleLanguage()" aria-label="Switch language">
          <span class="material-symbols-outlined" aria-hidden="true">translate</span>
          <span>{{ currentLanguageLabel }}</span>
        </button>

        @if (auth.currentAccount(); as account) {
          <a class="account-link" [routerLink]="accountHome" (click)="closeMobileMenu()">
            <span class="account-avatar" aria-hidden="true">{{ accountInitials }}</span>
            <span class="account-name">{{ account.name }}</span>
          </a>
          <button class="signout-button" type="button" [disabled]="signingOut" (click)="signOut()">
            {{ signingOut ? 'Please wait…' : 'Sign Out' }}
          </button>
        } @else {
          <a class="signin-link" routerLink="/auth/login" (click)="closeMobileMenu()">Sign In</a>
          <a class="signup-button" routerLink="/auth/register" (click)="closeMobileMenu()">
            Get started
            <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
          </a>
        }
      </div>
    </div>
  </div>

  @if (logoutError) {
    <p class="navbar-error" role="alert">{{ logoutError }}</p>
  }
</header>
